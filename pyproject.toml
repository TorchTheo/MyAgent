[project]
name = "agentharness"
version = "0.0.2"
description = "An extensible, observable agent harness for research: agent loop, pluggable tools, hot-swappable plugins, multi-agent workflows, trace viewer."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Repository = "https://github.com/TorchTheo/MyAgent"

[project.scripts]
agentharness = "agentharness.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

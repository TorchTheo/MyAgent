[project]
name = "agentharness"
version = "0.1.0"
description = "An extensible, observable agent harness for research: agent loop, pluggable tools, hot-swappable plugins, multi-agent workflows, trace viewer."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentharness = "agentharness.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
